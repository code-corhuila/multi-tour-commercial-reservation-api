name: CI
on:
  pull_request:
    branches: [develop, qa, main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  POSTGRES_IMAGE: postgres:18
  DB_NETWORK: cr-api-ci-net
  DB_CONTAINER: cr-api-ci-pg
  DB_RUNNER_IMAGE: cr-db-runner:api-ci
  DB_HOST_PORT: '55433'
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The 74 persistence classes of this service run here against a real PostgreSQL, so the job needs more than the
    # 10 minutes of a build that skipped them.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: code-corhuila/multi-tour-commercial-reservation-db
          ref: develop
          path: commercial-reservation-db
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate throwaway credentials
        # Generated in this job only, masked in the log and never written to the repository.
        run: |
          admin="$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          app="$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::add-mask::$admin"
          echo "::add-mask::$app"
          echo "DB_ADMIN_PASSWORD=$admin" >> "$GITHUB_ENV"
          echo "DB_APP_PASSWORD=$app" >> "$GITHUB_ENV"
      - name: Start PostgreSQL 18
        run: |
          docker network create "$DB_NETWORK"
          docker run -d --name "$DB_CONTAINER" --network "$DB_NETWORK" \
            -p "127.0.0.1:$DB_HOST_PORT:5432" -e POSTGRES_PASSWORD="$DB_ADMIN_PASSWORD" "$POSTGRES_IMAGE"
          for _ in $(seq 1 60); do
            if docker exec "$DB_CONTAINER" pg_isready -U postgres -d postgres -h 127.0.0.1 >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "${ready:-0}" = 1
      - name: Create the application role and the extension
        # The instance owns both (Annex J.7); the migrations only grant the writer to the user. The role can log in
        # because the integration tests connect with it.
        run: |
          docker exec -e PGPASSWORD="$DB_ADMIN_PASSWORD" "$DB_CONTAINER" \
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto" \
            -c "CREATE ROLE commercial_reservation_app LOGIN PASSWORD '$DB_APP_PASSWORD'"
      - name: Apply the database migrations
        # The schema commercial_reservation is created by the migration tree itself, with every changeset and no label filter.
        run: |
          docker build -q -t "$DB_RUNNER_IMAGE" -f commercial-reservation-db/deploy/Dockerfile commercial-reservation-db
          docker run --rm --network "$DB_NETWORK" -e LIQUIBASE_COMMAND_PASSWORD="$DB_ADMIN_PASSWORD" "$DB_RUNNER_IMAGE" \
            --url="jdbc:postgresql://$DB_CONTAINER:5432/postgres" --username=postgres \
            --changelog-file=changelog/changelog-master.yaml \
            --database-changelog-table-name=databasechangelog_commercial_reservation \
            --database-changelog-lock-table-name=databasechangeloglock_commercial_reservation \
            update
      - name: Verify
        # The admin variables only enable the one test that restores a snapshot with a privileged connection.
        run: mvn -B verify
        env:
          TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:${{ env.DB_HOST_PORT }}/postgres
          TEST_DATABASE_USER: commercial_reservation_app
          TEST_DATABASE_PASSWORD: ${{ env.DB_APP_PASSWORD }}
          TEST_DATABASE_ADMIN_USER: postgres
          TEST_DATABASE_ADMIN_PASSWORD: ${{ env.DB_ADMIN_PASSWORD }}
