          content:
            application/json:
              schema: {$ref: './_shared.yaml#/components/schemas/ErrorResponse'}
        '500':
          $ref: './_shared.yaml#/components/responses/InternalError'
  /reschedulings/{reschedulingId}/proposals/{proposalId}/external-answer:
