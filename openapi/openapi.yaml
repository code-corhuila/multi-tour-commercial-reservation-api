        instant the customer answered; the service adds the actor and the recording instant (AC-18.6, DP-04). It takes
        effect at once like the customer's answer, also while the tenant is inactive (AC-18.13). The evidence and the
        channel are never logged nor evented (AC-18.19). **Requires:** `TENANT_ADMINISTRATOR` or
        `OPERATIONAL_COLLABORATOR` (DP-01); the other roles and the customer get `403` before any load (AC-18.15).
