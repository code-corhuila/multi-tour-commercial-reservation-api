    get:
      summary: Get a rescheduling episode
      description: |
        **PROPOSED.** The episode with its proposals, the deadline in force and its history. An episode of another
        tenant answers `404`. **Requires:** `TENANT_ADMINISTRATOR`, `OPERATIONAL_COLLABORATOR`, `MANAGER`, `ACCOUNTANT`
        or `ANALYST`; the `FINAL_CUSTOMER` reads only their own proposal and a foreign one answers `404` (AC-18.16,
