      - $ref: '#/components/parameters/PaymentIdPath'
    post:
      summary: Record a payment as validated (step 2 of the saga register-payment)
      description: |
        **PROPOSED.** Step 2 of the saga `register-payment` (ADR-004 D3, HU-COM-010 DP-11, answer of
        2026-10-30): the portal triggers the saga, the human approval of a transfer happens before it, and
        after Cash recorded the income (step 1) the saga calls this route so the service records the
        payment as validated, recomputes the financial situation and confirms the reservation when the
        payment condition is met. A rejection never uses this route. The tenant comes from the path, as a
        service token has none; the approver is the user the saga acts for, sent in the body. Repeating
        the call for a payment already validated answers `200` with the stored result (idempotent), so
        the saga can retry. The gateway never routes it.
        `400 VALIDATION_ERROR` for a missing `approvedBy` or a verified amount that is zero, negative or not
        a whole number of cents.
        `422 INVALID_STATUS_TRANSITION` when the payment is in a state that cannot be validated (for
