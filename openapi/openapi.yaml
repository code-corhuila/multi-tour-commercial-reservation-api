  # ─── Internal: refund execution, job 2 and determinations (HU-COM-016) ──────────
  # PROPOSED (x-proposed): plan section 2 of HU-COM-016 (G-A). `SERVICE` role only; the gateway never routes `/internal/`.
  # The saga owns the order of its steps (HU-WFL-003); here are steps 1 and 3 and the undo of step 1. The service never
  # calls Cash. A step repeated with the same effect answers `200` and changes nothing (idempotent by state).
  /internal/tenants/{tenantId}/refund-authorizations/{refundAuthorizationId}/execution-start:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
      - $ref: '#/components/parameters/RefundAuthorizationIdPath'
    post:
      summary: Start the execution of a refund (saga step 1)
      description: |
        **PROPOSED.** Refuses a refund that has no prior authorization with `422 BUSINESS_RULE_VIOLATION` and changes
        nothing; an authorized one becomes `EXECUTING` with the person, the method and the instant of the clock
        (AC-16.4). The workflow checks that the person is Administrator or Collaborator and sends `executedBy` (DP-08,
        default). A repeat with the same person and method answers `200`; a refund already `EXECUTING` for another
        person or already `EXECUTED` answers `422 INVALID_STATUS_TRANSITION` (AC-16.19). **Requires:** `SERVICE` role
        and nothing else. A person's token gets `403` and the tenant comes from the path (AC-16.13).
      operationId: startRefundExecution
      tags: [Internal]
      security:
        - bearerAuth: []
      x-proposed: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefundExecutionStartRequest'}
      responses:
        '200':
          description: The refund as it stands, `EXECUTING`
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundAuthorization'}
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
        '422':
          description: The refund is not authorized (`BUSINESS_RULE_VIOLATION`) or cannot start from its state (`INVALID_STATUS_TRANSITION`); nothing changes
          content:
            application/json:
              schema: {$ref: './_shared.yaml#/components/schemas/ErrorResponse'}
        '500':
          $ref: './_shared.yaml#/components/responses/InternalError'
  /internal/tenants/{tenantId}/refund-authorizations/{refundAuthorizationId}/execution-undo:
    parameters:
