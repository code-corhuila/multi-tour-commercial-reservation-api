              schema:
                $ref: '#/components/schemas/PendingPaymentPage'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared.yaml#/components/responses/Forbidden'
        '500':
          $ref: './_shared.yaml#/components/responses/InternalError'

  /reservations/{reservationId}/payment-deadline:
    parameters:
      - $ref: '#/components/parameters/ReservationIdPath'
    get:
      summary: Get the payment deadline of a reservation
      description: |
        **PROPOSED.** The configured due instant, the extension if any, the departure start and the effective
        deadline: the lower of the due instant plus the extension and the departure start (AC-11.6).
        `frozen` is true while the deadline is frozen (AC-11.11); then `frozenCause` and `remainingMinutes` say why
        and how much time is left, so a screen shows it suspended without counting (AC-20.17). A reservation without a deadline row, or of
        another tenant, answers `404`; for a Final Customer, so does a reservation of another customer
        (AC-11.8, AC-11.10).
        **Requires:** `TENANT_ADMINISTRATOR`, `OPERATIONAL_COLLABORATOR`, `MANAGER`, `ACCOUNTANT` or
        `ANALYST` (read, PROPOSED, DP-02); `FINAL_CUSTOMER` on their own reservation.
      operationId: getPaymentDeadline
      tags: [Reservations]
      x-proposed: true
      responses:
