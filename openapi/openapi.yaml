        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './_shared.yaml#/components/responses/InternalError'
    post:
      summary: Record a payment follow-up
      description: |
        **PROPOSED.** Appends a follow-up with a required `note`; the date, time and user come from the clock and
        the token, never from the body. A follow-up, even one that records a customer reply, never changes the
        deadline (AC-11.5). The note is free text: it is stored, never logged and never put in an event
        (DP-03, DP-07). A repeat with the same `Idempotency-Key` answers `200` with the stored follow-up and
        creates no second record (AC-11.9). No event is emitted (DP-07).
        `400 VALIDATION_ERROR` naming `note` when it is missing or blank.
        `422 BUSINESS_RULE_VIOLATION` when the reservation is not pending payment (DP-04: the follow-up applies
        to the initial payment only).
