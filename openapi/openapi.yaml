        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './_shared.yaml#/components/responses/InternalError'

  # ─── Customers (HU-COM-005, PROPUESTO: not yet approved by the Project Lead) ──

  /customers:
    post:
      summary: Register the lead customer
      description: |
        PROPOSED (HU-COM-005, G-A). Registers the lead customer of a reservation. `serviceId` tells the
        service whether the activity is high risk; the mark is read from the catalog and never typed by
        the caller. For a high-risk activity `emergencyInfo` and `informedConsentSigned` are required
        (RN-CLI-003). The e-mail is trimmed and lower-cased. A customer is not unique by document in the
        tenant; there is no `409` and no delete. The response never carries sensitive data. Emits
        `CustomerRegistered` through the outbox, without document or medical data.
