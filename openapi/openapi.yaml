        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
        '422':
          description: A proposal exists or the episode is closed (`INVALID_STATUS_TRANSITION`); nothing changes
          content:
            application/json:
              schema: {$ref: './_shared.yaml#/components/schemas/ErrorResponse'}
        '500':
          $ref: './_shared.yaml#/components/responses/InternalError'
  /reschedulings/{reschedulingId}/proposals/{proposalId}/answer:
    parameters:
      - $ref: '#/components/parameters/ReschedulingIdPath'
      - $ref: '#/components/parameters/ProposalIdPath'
    post:
      summary: Answer a proposal as the customer
      description: |
        **PROPOSED.** The owner customer accepts or rejects from their panel and the answer takes effect at once
        (AC-18.6). `ACCEPT` moves the same reservation to the proposed departure, keeps payments and history, moves the
        seat in the same transaction and resumes the frozen deadlines (AC-18.1); `REJECT` cancels the reservation as in
        `no-alternative`. A second answer, a void or expired proposal, or an answer after the response deadline is `422
        INVALID_STATUS_TRANSITION` (AC-18.14, AC-18.20). A double click records one. **Requires:** `FINAL_CUSTOMER`,
        owner of the reservation; any other role gets `403` and a foreign proposal `404` (AC-18.15).
      operationId: answerReschedulingProposal
      tags: [Rescheduling]
      x-proposed: true
