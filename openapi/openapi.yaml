  # ─── Payment deadlines and follow-ups (HU-COM-011) ─────────────────────────
  # PROPOSED (x-proposed): plan section 2 of HU-COM-011 (G-A). The two last operations are internal, for job 1.
  # No `409` (D-M-09), no delete, no edit of a follow-up. The user is never read from the body.

  /pending-payments:
