    parameters:
      - $ref: '#/components/parameters/FinancialDecisionIdPath'
    post:
      summary: Authorize a refund
      description: |
        **PROPOSED.** Since DP-01 (2026-11-12) `refund-decision` already creates the refund of a 100 % decision; this
        route stays for the credit-balance refund request (HU-COM-017), for clients built before and for decisions
        recorded before the change. It is idempotent by state: if the decision already has its refund it answers that
        refund and changes nothing; otherwise it creates it with that amount, the origin, the mode
        `TENANT_ADMINISTRATOR`, the person, the instant and an execution due instant of five business days from
        `recognizedAt` of the decision (DP-02). `RefundAuthorized` goes to the outbox in the same transaction,
        without the reason (AC-16.2, AC-16.18). `400` for an empty `reason` (AC-16.12). **A credit-balance refund request
        (RN-RES-009, DP-17):** when the decision is of kind `CREDIT_BALANCE_REFUND_REQUEST` and still has no outcome, this
        same route records the outcome `AUTHORIZED` (by the Administrator, never by the system) and, in the same
        transaction, creates the refund for the requested amount; it is how the Administrator authorizes a request inside
        the 24 hours. `422 INVALID_STATUS_TRANSITION` without the outcome `REFUND_FULL`, or for a decision that is neither
        `REFUND_FULL` nor an open credit-balance request, or one already `REJECTED`; `422 BUSINESS_RULE_VIOLATION` while the tenant is inactive (DP-16). A repeat
        with the same `Idempotency-Key` answers `200` with the stored refund (AC-16.17). **Requires:** `TENANT_ADMINISTRATOR`. Any other role answers `403` before any load
        and nothing changes (AC-16.3).
