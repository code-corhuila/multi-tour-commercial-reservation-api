  /catalog/services/{serviceId}/departures/{departureId}/reservations:
    parameters:
      - $ref: '#/components/parameters/ServiceIdPath'
      - $ref: '#/components/parameters/DepartureIdPath'
    get:
      summary: List the reservations of a departure
      description: |
        **PROPOSED (2026-11-10, asked by `operations-cost`, HU-OPS-004 gap G-API6-1).** The reservations of one
        departure of a tour, so that `operations-cost` can show what each one reserved and record what it received
        (RN-EJE-003). It is called with the token of the person (`operations-cost` forwards it, as it does for the seats),
        never with a service token. Every state is returned and `reservationStatus` says which; the caller decides what to
        show. Ordered by creation, oldest first. The tenant is the one of the token; a departure of another tenant, a
        departure that does not belong to the tour of the path, or one with no row yet answers `404`.
        The rows carry the name of the lead customer and nothing else personal (no e-mail, phone or document, no companions);
        the name is never logged.
        **Requires:** `TENANT_ADMINISTRATOR`, or `OPERATIONAL_COLLABORATOR` whose claim `permissions` carries
        `MANAGE_DEPARTURE_EXECUTION` (*Gestionar ejecución de salidas*). `MANAGER`, `ACCOUNTANT`, `ANALYST`, `FINAL_CUSTOMER` and `SERVICE` get `403`.
        **Exceptional access (HU-SEC-007, PROPOSED 2026-11-11):** a token `access: exceptional` or `access: emergency` whose `scope`
        carries `RESERVATIONS` reads this list as `PLATFORM_SUPPORT`, read only and audited; with another scope it gets `403`.
      operationId: listDepartureReservations
