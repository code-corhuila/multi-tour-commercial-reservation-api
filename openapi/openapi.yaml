  /financial-decisions/{financialDecisionId}:
    parameters:
      - $ref: '#/components/parameters/FinancialDecisionIdPath'
    get:
      summary: Get a financial decision
      description: |
        **PROPOSED.** The whole decision, never editable (AC-16.14). A decision of another tenant answers `404`
        (AC-16.13). **Requires:** `TENANT_ADMINISTRATOR` or `OPERATIONAL_COLLABORATOR`; the other roles and the Final
        Customer get `403` (DP-04, OPEN).
      operationId: getFinancialDecision
      tags: [Refunds]
      x-proposed: true
      responses:
        '200':
          description: The decision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinancialDecision'}
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
        '500':
