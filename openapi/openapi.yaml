        **PROPOSED.** The 24-hour decisions that open from a recognized value (AC-16.15), newest first, with the amount,
        the outcome and `decisionDueAt` from which the portal draws the counter and the reminder. `pending=true` keeps
        the decisions with no outcome or with `REFUND_FULL` and no refund yet; `attention=true` keeps what needs the
        Administrator now (DP-09, the alert is derived, not stored). **Requires:** `TENANT_ADMINISTRATOR` or
        `OPERATIONAL_COLLABORATOR`; the other roles and the Final Customer get `403` (DP-04, OPEN).
      operationId: listFinancialDecisions
