        **PROPOSED.** Called by the saga when a departure is cancelled or interrupted, one reservation per call (DP-06).
        One episode exists per reservation and incident, so a repeat changes nothing and answers `200`. Sets the mark,
        releases the seat of the cancelled departure, freezes the economic deadlines and counts the 24 hours from
        `cancelledAt`, not from the call (AC-18.8). **Requires:** `SERVICE` role and nothing else. A person's token gets
        `403` and the tenant comes from the path (AC-18.15).
      operationId: openRescheduling
      tags: [Internal]
      security:
        - bearerAuth: []
      x-proposed: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
