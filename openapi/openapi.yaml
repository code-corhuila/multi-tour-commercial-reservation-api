        **PROPOSED.** The rows of the pending-payments body of the "Pagos" screen. The effective deadline is
        derived at read time (AC-11.6). Frozen deadlines are not listed (AC-11.11). `hasProofInValidation` lets
        the portal leave to HU-COM-010 the rows that already have a proof. Whether `BALANCE` and
        `PENDING_DIFFERENCE` rows are listed is OPEN (DP-04).
        **Requires:** `TENANT_ADMINISTRATOR`, `OPERATIONAL_COLLABORATOR`, `MANAGER`, `ACCOUNTANT` or
        `ANALYST` (read, PROPOSED, DP-02).
      operationId: listPendingPayments
      tags: [Reservations]
      x-proposed: true
      parameters:
        - name: kind
          in: query
          description: Deadline kind to list; every listed kind when omitted
          schema:
            $ref: '#/components/schemas/PaymentDeadlineKind'
        - $ref: './_shared.yaml#/components/parameters/PageParam'
        - $ref: './_shared.yaml#/components/parameters/LimitParam'
      responses:
