    get:
      summary: List the follow-ups of a reservation
      description: |
        **PROPOSED.** The history of the screen "Registrar seguimiento", newest first (AC-11.7).
        **Requires:** `TENANT_ADMINISTRATOR`, `OPERATIONAL_COLLABORATOR`, `MANAGER`, `ACCOUNTANT` or
        `ANALYST` (read, PROPOSED, DP-02). A reservation of another tenant answers `404`.
