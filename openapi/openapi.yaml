              schema: {$ref: './_shared.yaml#/components/schemas/ErrorResponse'}
        '500':
          $ref: './_shared.yaml#/components/responses/InternalError'

  # ─── Internal: rescheduling opening, freeze, expiry and voiding (HU-COM-018) ────
  # PROPOSED (x-proposed): plan section 2 of HU-COM-018 (G-A). `SERVICE` role only; the gateway never routes `/internal/`.
  /internal/tenants/{tenantId}/reschedulings:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    post:
      summary: Open the rescheduling episode of a reservation
