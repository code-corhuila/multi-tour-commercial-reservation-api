  /reservations/{reservationId}/payment-deadline/extension:
    parameters:
      - $ref: '#/components/parameters/ReservationIdPath'
    post:
      summary: Grant the single extension of a payment deadline
      description: |
        **PROPOSED.** Grants the one extension of the initial payment deadline, of `hours` from 1 to the
        maximum of the payment condition (DP-05, OPEN: the value is not defined). Duration, date, time and
        person are recorded and the deadline moves by that duration without passing the departure start
        (AC-11.3). A repeat with the same `Idempotency-Key` answers `200`. No event is emitted (DP-07). The
        portal has this control in its demo module; its real HTTP source is in progress (portal DP-PP6).
        `400 VALIDATION_ERROR` naming `hours` when it is missing, not an integer or below 1.
        `422 BUSINESS_RULE_VIOLATION` for a second extension, an expired or frozen deadline, a kind other than
        the initial payment, hours above the maximum, a result past the departure start or a reservation that
        is not pending payment.
        **Requires:** `TENANT_ADMINISTRATOR` or `OPERATIONAL_COLLABORATOR`. Any other role answers `403`.
      operationId: grantPaymentDeadlineExtension
      tags: [Reservations]
      x-proposed: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantExtensionRequest'
      responses:
        '201':
          description: Extension granted; the deadline as it stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPaymentDeadline'
        '200':
          description: Repeated request with the same `Idempotency-Key`; returns the deadline already extended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPaymentDeadline'
        '400':
