        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpenReschedulingRequest'}
      responses:
        '201':
          description: Episode opened
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Rescheduling'}
        '200':
