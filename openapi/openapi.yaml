  # ─── Rescheduling of an affected reservation (HU-COM-018) ───────────────────────
  # PROPOSED (x-proposed): plan section 2 of HU-COM-018 (G-A). No route creates a linked reservation (AC-18.2, DP-02).
  # The opening, the voiding, the freeze, the resume and the expiry are `SERVICE` only. No `409`, no delete.
  /reschedulings:
    get:
      summary: List the rescheduling episodes of the tenant
      description: |
        **PROPOSED.** Each episode with the deadline in force and its history, narrowed by `reservationId`,
        `departureId` or `state` (AC-18.16). The 24 hours to propose, the response deadline of each proposal and the
        96-hour limit are computed by the service (AC-18.5). **Requires:** `TENANT_ADMINISTRATOR`,
        `OPERATIONAL_COLLABORATOR`, `MANAGER`, `ACCOUNTANT` or `ANALYST`; the `FINAL_CUSTOMER` reads only their own
        proposal and a foreign one answers `404` (AC-18.16, AC-18.18).
      operationId: listReschedulings
      tags: [Rescheduling]
      x-proposed: true
      parameters:
        - {name: reservationId, in: query, schema: {$ref: './_shared.yaml#/components/schemas/UUID'}}
        - {name: departureId, in: query, schema: {$ref: './_shared.yaml#/components/schemas/UUID'}}
