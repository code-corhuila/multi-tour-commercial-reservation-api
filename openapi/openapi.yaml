      description: |
        **PROPOSED.** Only before any proposal exists. The reservation becomes `CANCELLED` with cause
        `NOT_ATTRIBUTABLE_TO_CUSTOMER`, its seats are released and a refund of 100 percent of the validated values is
        determined through HU-COM-016; with none validated, none is determined (AC-18.7). `422
        INVALID_STATUS_TRANSITION` once a proposal exists or the episode is closed. A repeat answers `200`.
