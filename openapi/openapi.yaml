      responses:
        '201':
          description: Customer registered
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '200':
          description: Repeated request with the same `Idempotency-Key`; returns the customer already created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared.yaml#/components/responses/Forbidden'
        '500':
          $ref: './_shared.yaml#/components/responses/InternalError'
    get:
      summary: Search the customers of the tenant by name (ordinary data)
      description: |
        PROPOSED (HU-COM-005 F-18, amended 2026-11-09; the customer picker of HU-COM-007). Returns the customers of the
        tenant of the token whose full name starts with `search`, compared in lower case and ordered by name and
        identifier, so the index `idx_customer_tenant_full_name` serves it. The search is by name only: the document and
        the e-mail have no search until DP-D5-2 and DP-D5-3 are closed. `search` is trimmed and needs at least 2
        characters, otherwise `400`. Ordinary data only (the same `CustomerResponse` as the read by id); sensitive
        values are never included. A customer of another tenant never appears. The text searched is not logged and
        the answer is not cached. `limit` is 20 by default and 50 at most; `next` is the opaque cursor to send as
        `cursor` for the following page and is null on the last.
        **Requires:** `TENANT_ADMINISTRATOR`, `OPERATIONAL_COLLABORATOR`, `MANAGER` or `ANALYST` (read,
        `authentication.md` section 4). `ACCOUNTANT` is refused.
      operationId: searchCustomers
      tags: [Customers]
      x-proposed: true
      parameters:
        - name: search
          in: query
          required: true
          description: Start of the full name, 2 to 100 characters after trimming
          schema: {type: string, minLength: 2, maxLength: 100}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned as `next` by the previous page
          schema: {type: string, maxLength: 256}
      responses:
        '200':
          description: A page of customers of the tenant, possibly empty
          headers:
            Cache-Control:
              schema: {type: string, example: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSearchPage'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared.yaml#/components/responses/Forbidden'
        '500':
          $ref: './_shared.yaml#/components/responses/InternalError'

