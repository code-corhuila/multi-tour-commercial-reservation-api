  /financial-decisions/{financialDecisionId}/refund-decision:
    parameters:
      - $ref: '#/components/parameters/FinancialDecisionIdPath'
    post:
      summary: Record the decision to refund 100 percent
      description: |
        **PROPOSED.** One single act (DP-01, decided 2026-11-12): records the outcome `REFUND_FULL` and, in the same
        transaction, creates the refund authorization (mode `TENANT_ADMINISTRATOR`) and puts `RefundAuthorized` in the
        outbox, once. `executionDueAt` counts five business days from `recognizedAt` of the decision, not from this
        call (DP-02). The amount is the base amount of the decision and nothing in the request can change it (AC-16.1).
        The body is optional and accepts only `reason` (1 to 500 characters after trimming); when it is missing the
        refund keeps the fixed reason "Refund of 100 % decided by the Tenant Administrator"; a blank `reason` or any
        other field is `400` naming the field. The answer is the decision with the additive field
        `refundAuthorizationId`. A repeat with the same `Idempotency-Key` answers `200` with the stored decision. `422
        INVALID_STATUS_TRANSITION` if the decision already has an outcome or the 24 hours defaulted it (AC-16.19).
        `422 BUSINESS_RULE_VIOLATION` while the tenant is inactive (DP-16). **Requires:** `TENANT_ADMINISTRATOR`. Any
        other role, and the Administrator with restricted access, answers `403` before any load and nothing changes
        (AC-16.3).
      operationId: recordRefundDecision
      tags: [Refunds]
      x-proposed: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordRefundDecisionRequest'}
      responses:
        '200':
          description: The decision with its outcome and the refund it created (`refundAuthorizationId`); also the answer of a repeat
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordRefundDecisionResponse'}
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '403':
