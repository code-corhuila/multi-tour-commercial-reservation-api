    post:
      summary: Apply a credit balance to a reservation
      description: |
        **PROPOSED.** The application counts as a validated payment: the pending balance falls, the payment situation is
        recomputed and the reservation is confirmed if its condition is met (AC-17.4). The target is a reservation of
        the same tenant and the same customer (DP-01, default: also an existing one with a pending balance). A first
        payment holds the seat in the same transaction or nothing is applied (AC-17.5). Records who applied and whether
        as `CUSTOMER` or `STAFF` (AC-17.8). `400` for an amount of zero or less (AC-17.7). `422 BUSINESS_RULE_VIOLATION`
        for another customer's reservation, a cancelled, finished or started one, no pending balance, an amount above
        the available credit or the pending balance, or the loser of two applications at once (AC-17.6, AC-17.18).
        Refused while the tenant is inactive (DP-09). A repeat with the same `Idempotency-Key` answers `200`.
        **Requires:** `TENANT_ADMINISTRATOR`, `OPERATIONAL_COLLABORATOR` (on behalf of the customer) or `FINAL_CUSTOMER`
        (own credit only, DP-08, OPEN). `MANAGER`, `ACCOUNTANT` and `ANALYST` answer `403` before any load (AC-17.14,
