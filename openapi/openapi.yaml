        reason; `422 BUSINESS_RULE_VIOLATION` for an amount above the available value. A repeat with the same
        `Idempotency-Key` answers `200`. **Requires:** `TENANT_ADMINISTRATOR`, `OPERATIONAL_COLLABORATOR` (on behalf of
        the customer) or `FINAL_CUSTOMER` (own credit only, DP-08, OPEN). `MANAGER`, `ACCOUNTANT` and `ANALYST` answer
