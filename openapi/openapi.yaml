  /internal/tenants/{tenantId}/reservations/{reservationId}/expiry:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
      - $ref: '#/components/parameters/ReservationIdPath'
    post:
      summary: Ask the service to expire a reservation
      description: |
        **PROPOSED.** The job asks and the service decides: it re-checks the condition at the call (RN-07). If
        the reservation is expirable it is cancelled with cause `PAYMENT_EXPIRY`, its seat is released and
        `ReservationCancelled` and `CapacityReleased` are written in one transaction (AC-11.2, AC-11.15).
        If it is not, nothing changes and the answer is `200` with `expired` false and the reason. A repeat
        changes nothing (AC-11.9). The cause code is OPEN (DP-01). While the tenant is inactive the answer is `200`
        with `expired` false and the reason `TENANT_INACTIVE`, and nothing is cancelled (AC-20.1, AC-20.19).
        **Requires:** `SERVICE` role and nothing else. A person's token gets `403` (AC-11.12).
      operationId: expireReservation
      tags: [Internal]
      security:
        - bearerAuth: []
      x-proposed: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The result of the call; nothing changed when `expired` is false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpiryResult'
              example:
                reservationId: 3f2a1c9e-7b64-4d0e-9a51-0c6e8d2b4f10
                expired: false
                reason: PROOF_IN_VALIDATION
                reservationStatus: PENDING_PAYMENT
