      tags: [Reservations]
      x-proposed: true
      parameters:
        - $ref: './_shared.yaml#/components/parameters/PageParam'
        - $ref: './_shared.yaml#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated follow-ups of the reservation
          content:
            application/json:
              schema:
                type: object
