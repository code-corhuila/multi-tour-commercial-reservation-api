      responses:
        '201':
          description: Answer recorded; the episode as it stands
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Rescheduling'}
        '200':
          description: Repeated request with the same `Idempotency-Key`; the stored episode
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Rescheduling'}
