            schema: {$ref: '#/components/schemas/AuthorizeRefundRequest'}
      responses:
        '201':
          description: Refund authorized; the record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundAuthorization'}
        '200':
          description: Repeated request with the same `Idempotency-Key`; the stored record
